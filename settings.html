<!DOCTYPE html>
<html>
    <head>
       <!-- <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>-->
        <title>Dahlia Settings Flyout</title>
        <!--<link rel="stylesheet" href="//Microsoft.WinJS.1.0/css/ui-light.css" />-->
        <script src="//Microsoft.WinJS.1.0/js/base.js"></script>
        <script src="//Microsoft.WinJS.1.0/js/ui.js"></script>
        <script>
            (function () {
                "use strict";
                var app = WinJS.Application;
                var activation = Windows.ApplicationModel.Activation;
                var page = WinJS.UI.Pages.define("settings.html", {

                    ready: function (element, options) {
                        // Register the handlers for dismissal
                        document.getElementById("receiverName").value = Windows.Storage.ApplicationData.current.localSettings.values["receiverName"] || 'Dahlia PlayToReceiver';
                        document.getElementById("receiverName").addEventListener("change", function () {
                            Windows.Storage.ApplicationData.current.localSettings.values["receiverName"] = document.getElementById("receiverName").value || '';
                        });
                    },
                    unload: function () {  
                        document.getElementById("receiverName").removeEventListener("change");
                    },
                });
            })();
        </script>
    </head>
    <body>
        <div data-win-control="WinJS.UI.SettingsFlyout" aria-label="Help settings flyout" data-win-options="{settingsCommandId:'settings',width:'wide'}">
            <!-- Use either 'win-ui-light' or 'win-ui-dark' depending on the contrast between the header title and background color -->
            <div class="win-ui-dark win-header" style="background-color:#A6E35F;"> <!-- Background color reflects app's personality -->
               <button type="button" onclick="WinJS.UI.SettingsFlyout.show()" class="win-backbutton" style="color:black; outline-color:black; border-color:black;"></button>
               <div class="win-label" style="color:black;">设置 Settings</div>
               <!--<img src="../images/smallTile-sdk.png" style="position: absolute; right: 40px;"/>-->
            </div>
            <div class="win-content ">
                <div class="win-settings-section">
                    <h3>更改接收器名称 Rename the receiver</h3>
                    <textarea id="receiverName" maxlength="514"></textarea>
                    <p>重启接收器生效
                        <br />
                        Takes effect after the receiver restarted</p>
                </div>
            </div>
        </div>
    </body>
</html>
